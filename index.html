<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSale3 Camping Store | Premium Outdoor Gear Laos</title>
    
    <!-- Scripts & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --adventure-green: #064e3b;
            --forest-mid: #065f46;
            --emerald-vibrant: #10b981;
            --accent-amber: #f59e0b;
            --forest-bg: #042f2e;
            --glass-white: rgba(255, 255, 255, 0.95);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #065f46, #022c22 70%);
            background-attachment: fixed;
            color: #f8fafc; 
            scroll-behavior: smooth;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/topography.png");
            opacity: 0.1;
            filter: invert(1);
            pointer-events: none;
            z-index: -1;
        }
        
        .nav-blur { 
            background: rgba(4, 47, 46, 0.8); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hero-banner { 
            background: linear-gradient(to bottom, rgba(4, 47, 46, 0.2), rgba(2, 44, 34, 0.9)), url('https://i.postimg.cc/FKL5Q4JW/489751506-1424454392283349-8154752889413656228-n.jpg'); 
            background-size: cover; 
            background-position: center; 
            border-bottom: 8px solid var(--accent-amber);
        }
        
        .card-modern { 
            background: var(--glass-white); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 32px; 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            color: #1f2937;
        }

        .card-modern:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 30px 50px -15px rgba(16, 185, 129, 0.3);
            border-color: var(--emerald-vibrant);
            background: #ffffff;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-link { color: var(--emerald-vibrant) !important; border-bottom: 4px solid var(--accent-amber); }

        .modal-overlay { 
            background: rgba(2, 44, 34, 0.9); 
            backdrop-filter: blur(15px); 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 100; 
            align-items: center; 
            justify-content: center; 
        }
        
        .category-pill { 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            white-space: nowrap; 
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        .category-pill.active { 
            background-color: var(--accent-amber); 
            color: white; 
            border-color: var(--accent-amber);
        }

        .status-in-stock { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-pre-order { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

        .btn-adventure {
            background: linear-gradient(135deg, var(--adventure-green) 0%, var(--forest-mid) 100%);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- App Logic -->
    <script>
        window.state = {
            products: [],
            places: [],
            blogs: [],
            cart: JSON.parse(localStorage.getItem('thesale3_cart') || '[]'),
            currentCategory: 'All'
        };

        const categories = ["All", "Tents", "Cooking", "Coffee", "Lighting", "Sleeping", "Furniture", "Backpack", "Shoes", "Cloth", "Glasses", "Powerbank", "Survival"];
        // Updated to the new sheet URL provided
        const ADMIN_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1N09HDxPd3zEDqxHR-knpH2MP_fq_XkLJZJ4FdCAYEG0/edit';

        // --- Navigation ---
        window.switchPage = (pageId) => {
            document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-link'));
            
            const target = document.getElementById('page-' + pageId);
            if(target) target.classList.remove('hidden');
            
            const btn = document.getElementById('btn-' + pageId);
            if(btn) btn.classList.add('active-link');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (pageId === 'products') window.renderProducts(window.state.products);
            if (pageId === 'places') window.renderPlaces(window.state.places);
            if (pageId === 'blogs') window.renderBlogs(window.state.blogs);
        };

        // --- UI Rendering ---
        window.renderProducts = (items) => {
            const grid = document.getElementById('productGrid');
            if(!grid) return;
            if (items.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-emerald-100 opacity-50">ກຳລັງໂຫລດສິນຄ້າ...</div>';
                return;
            }
            grid.innerHTML = items.map(p => `
                <div class="card-modern group p-8 flex flex-col fade-in cursor-pointer" onclick="window.openDetails('${p.id}')">
                    <div class="h-56 rounded-[28px] bg-emerald-100/30 overflow-hidden mb-6 relative">
                        <img src="${p.img}" class="w-full h-full object-cover transition duration-700 hover:scale-110" onerror="this.src='https://placehold.co/400x400?text=Gear'">
                        <span class="absolute top-4 right-4 text-[9px] font-black uppercase px-4 py-2 rounded-full ${p.status?.toLowerCase().includes('pre') ? 'status-pre-order' : 'status-in-stock'}">${p.status}</span>
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                        <div class="h-[1px] w-4 bg-amber-500"></div>
                        <span class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">${p.category}</span>
                    </div>
                    <h3 class="font-black text-lg text-emerald-950 mb-4 flex-grow uppercase italic leading-tight">${p.name}</h3>
                    <div class="mt-auto flex justify-between items-center pt-6 border-t border-emerald-100/50">
                        <p class="font-black text-emerald-700 italic text-md">${p.price?.toLocaleString()} LAK</p>
                        <button onclick="event.stopPropagation(); window.addToCart('${p.id}')" class="w-12 h-12 rounded-2xl bg-emerald-950 text-white flex items-center justify-center hover:bg-amber-500 transition-all shadow-lg"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>`).join('');
        };

        window.renderPlaces = (items) => {
            const grid = document.getElementById('placesGrid');
            if(!grid) return;
            if(items.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-emerald-100 opacity-50">ກຳລັງໂຫລດຂໍ້ມູນສະຖານທີ່...</div>';
                return;
            }
            grid.innerHTML = items.map(place => `
                <div class="card-modern overflow-hidden fade-in p-0 cursor-pointer" onclick="window.openPlaceDetails('${place.name}')">
                    <div class="h-64 bg-emerald-100 overflow-hidden relative">
                        <img src="${place.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400?text=Camp'">
                        <div class="absolute top-4 left-4 px-3 py-1 bg-white/20 backdrop-blur-md rounded-full border border-white/30 text-white font-bold text-[9px] uppercase">${place.price}</div>
                    </div>
                    <div class="p-8 text-emerald-950">
                        <h3 class="font-black text-xl italic uppercase mb-3 leading-none">${place.name}</h3>
                        <div class="flex items-center gap-2 text-[10px] font-bold text-emerald-500 uppercase mb-4"><i class="fa-solid fa-location-dot text-amber-500"></i> ${place.loc}</div>
                        <p class="text-gray-500 text-xs line-clamp-2">${place.desc}</p>
                    </div>
                </div>`).join('');
        };

        window.renderBlogs = (items) => {
            const grid = document.getElementById('blogsGrid');
            if(!grid) return;
            if(items.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-emerald-100 opacity-50">ກຳລັງໂຫລດບົດຄວາມ...</div>';
                return;
            }
            grid.innerHTML = items.map(blog => `
                <div class="flex flex-col md:flex-row gap-6 items-center fade-in bg-white/80 p-8 rounded-[40px] card-modern p-0 overflow-hidden cursor-pointer" onclick="window.openBlogDetails('${blog.title}')">
                    <div class="w-full md:w-1/3 h-56 flex-shrink-0"><img src="${blog.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300?text=Blog'"></div>
                    <div class="w-full md:w-2/3 p-4 md:p-0 pr-8 text-emerald-950">
                        <span class="text-[10px] font-bold text-amber-500 uppercase mb-3 block">${blog.date}</span>
                        <h3 class="text-2xl font-black mb-4 uppercase italic leading-tight">${blog.title}</h3>
                        <p class="text-gray-500 text-sm line-clamp-3">${blog.content}</p>
                    </div>
                </div>`).join('');
        };

        // --- Other UI Logic ---
        window.updateCartCount = () => {
            const count = window.state.cart.reduce((s, i) => s + (i.qty || 0), 0);
            const badge = document.getElementById('cartCount');
            if(badge) {
                badge.innerText = count;
                count > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');
            }
            localStorage.setItem('thesale3_cart', JSON.stringify(window.state.cart));
        };

        window.addToCart = (id) => {
            const p = window.state.products.find(x => x.id === id);
            if(!p) return;
            const exists = window.state.cart.find(i => i.id === id);
            if(exists) exists.qty++; else window.state.cart.push({ ...p, qty: 1 });
            window.updateCartCount();
        };

        window.openCart = () => {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            if(!container) return;
            if(window.state.cart.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-emerald-200">Bag empty</div>';
                if(totalEl) totalEl.innerText = '0 LAK';
            } else {
                let total = 0;
                container.innerHTML = window.state.cart.map(item => {
                    total += item.price * (item.qty || 1);
                    return `<div class="flex gap-4 p-4 bg-emerald-50 rounded-2xl text-emerald-950 items-center">
                        <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover">
                        <div class="flex-grow">
                            <h4 class="font-black text-[10px] uppercase leading-tight">${item.name}</h4>
                            <p class="text-emerald-700 font-bold text-[9px]">${item.price.toLocaleString()} LAK</p>
                        </div>
                        <div class="font-black text-xs">x${item.qty}</div>
                    </div>`;
                }).join('');
                if(totalEl) totalEl.innerText = total.toLocaleString() + ' LAK';
            }
            document.getElementById('cartModal').style.display = 'flex';
        };

        window.closeCart = () => document.getElementById('cartModal').style.display = 'none';

        window.openDetails = (id) => {
            const p = window.state.products.find(x => x.id === id);
            if(!p) return;
            document.getElementById('detailsImage').src = p.img;
            document.getElementById('detailsTitle').innerText = p.name;
            document.getElementById('detailsPrice').innerText = p.price.toLocaleString() + ' LAK';
            document.getElementById('detailsCategory').innerText = p.category;
            document.getElementById('detailsDesc').innerText = p.desc;
            const statusBadge = document.getElementById('detailsStatus');
            statusBadge.innerText = p.status;
            statusBadge.className = `px-5 py-2.5 rounded-full border-2 text-[10px] font-black ${p.status?.toLowerCase().includes('pre') ? 'status-pre-order' : 'status-in-stock'}`;
            document.getElementById('detailsAddBtn').onclick = () => { window.addToCart(p.id); window.closeDetails(); };
            document.getElementById('detailsWaBtn').href = `https://wa.me/8562054849393?text=${encodeURIComponent("ສົນໃຈ: " + p.name)}`;
            document.getElementById('detailsModal').style.display = 'flex';
        };

        window.closeDetails = () => document.getElementById('detailsModal').style.display = 'none';

        window.openPlaceDetails = (name) => {
            const place = window.state.places.find(x => x.name === name);
            if(!place) return;
            document.getElementById('placeDetailsImage').src = place.img;
            document.getElementById('placeDetailsTitle').innerText = place.name;
            document.getElementById('placeDetailsLoc').innerText = place.loc;
            document.getElementById('placeDetailsPrice').innerText = place.price;
            document.getElementById('placeDetailsDesc').innerText = place.desc;
            document.getElementById('placeDetailsWaBtn').href = `https://wa.me/8562054849393?text=${encodeURIComponent("ສອບຖາມກ່ຽວກັບ: " + place.name)}`;
            document.getElementById('placeModal').style.display = 'flex';
        };

        window.closePlaceModal = () => document.getElementById('placeModal').style.display = 'none';

        window.openBlogDetails = (title) => {
            const blog = window.state.blogs.find(x => x.title === title);
            if(!blog) return;
            document.getElementById('blogDetailsImage').src = blog.img;
            document.getElementById('blogDetailsTitle').innerText = blog.title;
            document.getElementById('blogDetailsDate').innerText = blog.date;
            document.getElementById('blogDetailsContent').innerText = blog.content;
            document.getElementById('blogModal').style.display = 'flex';
        };

        window.closeBlogModal = () => document.getElementById('blogModal').style.display = 'none';

        window.renderCategoryFilters = () => {
            const container = document.getElementById('categoryFilter');
            if(!container) return;
            container.innerHTML = categories.map(cat => `
                <button onclick="window.setCategory('${cat}')" class="category-pill ${window.state.currentCategory === cat ? 'active' : ''} px-8 py-3 rounded-2xl text-[10px] font-bold uppercase tracking-widest">
                    ${cat}
                </button>
            `).join('');
        };

        window.setCategory = (cat) => {
            window.state.currentCategory = cat;
            window.renderCategoryFilters();
            window.applyProductFilters();
        };

        window.applyProductFilters = () => {
            const si = document.getElementById('searchInput');
            const val = si ? si.value.toLowerCase() : "";
            const filtered = window.state.products.filter(p => {
                const mSearch = p.name?.toLowerCase().includes(val);
                const mCat = window.state.currentCategory === 'All' || p.category?.toLowerCase() === window.state.currentCategory.toLowerCase();
                return mSearch && mCat;
            });
            window.renderProducts(filtered);
        };

        window.checkoutWhatsApp = () => {
            if(window.state.cart.length === 0) return;
            let msg = "Order Inquiry from TheSale3:\n";
            window.state.cart.forEach(i => msg += `- ${i.name} x${i.qty}\n`);
            window.open(`https://wa.me/8562054849393?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.handleAdminClick = () => {
            let adminClicks = parseInt(sessionStorage.getItem('admin_clicks') || '0');
            adminClicks++;
            if (adminClicks === 5) {
                sessionStorage.setItem('admin_clicks', '0');
                const pass = prompt("Access Key:");
                if (pass === "Mou54849393") window.open(ADMIN_SHEET_URL, '_blank');
            } else {
                sessionStorage.setItem('admin_clicks', adminClicks.toString());
            }
            setTimeout(() => sessionStorage.setItem('admin_clicks', '0'), 3000);
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.switchPage('home');
            window.updateCartCount();
        });
    </script>

    <!-- Navigation -->
    <nav class="nav-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-20 sm:h-24">
                <div class="cursor-pointer flex items-center" onclick="window.switchPage('home')">
                    <img src="https://raw.githubusercontent.com/Mou-thesale/camping-catalog/main/assets/products/thesale3-logo.png" 
                         alt="TheSale3 Logo" 
                         class="h-14 sm:h-20 w-auto object-contain drop-shadow-xl" 
                         onerror="this.src='https://placehold.co/400x160?text=TheSale3+Logo'">
                </div>

                <div class="hidden md:flex items-center gap-8 font-bold text-[10px] uppercase tracking-widest text-slate-300">
                    <button onclick="window.switchPage('products')" class="nav-btn py-2 hover:text-white" id="btn-products">Products</button>
                    <button onclick="window.switchPage('places')" class="nav-btn py-2 hover:text-white" id="btn-places">Places</button>
                    <button onclick="window.switchPage('blogs')" class="nav-btn py-2 hover:text-white" id="btn-blogs">Journal</button>
                </div>

                <div class="flex items-center gap-4">
                    <button onclick="window.openCart()" class="relative p-2.5 bg-white/10 rounded-2xl border border-white/10 hover:bg-white/20 transition">
                        <i class="fa-solid fa-cart-shopping text-white"></i>
                        <span id="cartCount" class="absolute -top-1 -right-1 bg-amber-500 text-white text-[8px] font-black w-4 h-4 flex items-center justify-center rounded-full border-2 border-emerald-950 hidden">0</span>
                    </button>
                    <a href="https://wa.me/8562054849393" target="_blank" class="bg-emerald-600 text-white px-6 py-2.5 rounded-2xl text-[9px] font-black uppercase tracking-widest hidden sm:flex items-center gap-2 btn-adventure shadow-lg">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Sections -->
    <div id="pages-container">
        <!-- Home -->
        <section id="page-home" class="page-section">
            <header class="hero-banner h-[600px] flex items-center justify-center text-center px-4 relative overflow-hidden">
                <div class="max-w-3xl fade-in z-10">
                    <h1 class="text-6xl sm:text-8xl font-black text-white mb-8 tracking-tighter drop-shadow-2xl italic">The Forest<br><span class="text-amber-500">Starts Here.</span></h1>
                    <button onclick="window.switchPage('products')" class="bg-amber-500 text-white px-12 py-4 rounded-[22px] font-black text-[11px] uppercase tracking-widest hover:bg-amber-600 transition shadow-2xl scale-105 mt-6">Shop Catalog</button>
                </div>
            </header>
        </section>

        <!-- Products -->
        <section id="page-products" class="page-section hidden py-20 px-4 max-w-7xl mx-auto w-full">
            <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-8">
                <h2 class="text-5xl font-black uppercase italic tracking-tighter text-white">Catalog</h2>
                <div class="relative w-full md:w-[400px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-emerald-300"></i>
                    <input type="text" id="searchInput" oninput="window.applyProductFilters()" placeholder="Search gear..." class="w-full pl-16 pr-8 py-4 rounded-[22px] bg-white/10 border border-white/20 text-white outline-none focus:border-emerald-500">
                </div>
            </div>
            <div id="categoryFilter" class="flex gap-4 overflow-x-auto no-scrollbar pb-8 mb-6"></div>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <!-- Places -->
        <section id="page-places" class="page-section hidden py-24 px-4 max-w-7xl mx-auto w-full">
            <h2 class="text-5xl font-black uppercase italic tracking-tighter text-white text-center mb-16">Adventure Spots</h2>
            <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
        </section>

        <!-- Blogs -->
        <section id="page-blogs" class="page-section hidden py-24 px-4 max-w-7xl mx-auto w-full">
            <h2 class="text-5xl font-black uppercase italic tracking-tighter text-white text-center mb-16">Outdoor Journal</h2>
            <div id="blogsGrid" class="flex flex-col gap-10"></div>
        </section>
    </div>

    <!-- Modals -->
    <div id="detailsModal" class="modal-overlay" onclick="if(event.target === this) window.closeDetails()">
        <div class="bg-white rounded-[40px] max-w-4xl w-full mx-4 overflow-hidden shadow-2xl flex flex-col md:flex-row relative max-h-[92vh] border-8 border-emerald-950/20">
            <button onclick="window.closeDetails()" class="absolute top-6 right-6 bg-emerald-50 w-12 h-12 rounded-2xl flex items-center justify-center text-emerald-950 z-10 shadow-lg"><i class="fa-solid fa-xmark"></i></button>
            <div class="md:w-1/2 bg-emerald-50 flex items-center justify-center p-8">
                <img id="detailsImage" src="" class="max-w-full max-h-[400px] object-contain">
            </div>
            <div class="md:w-1/2 p-10 flex flex-col overflow-y-auto bg-white">
                <span id="detailsCategory" class="text-[10px] font-black text-emerald-600 uppercase mb-4">Category</span>
                <h2 id="detailsTitle" class="text-3xl font-black text-emerald-950 mb-6 uppercase italic">Name</h2>
                <div class="flex items-center gap-6 mb-8">
                    <p id="detailsPrice" class="text-3xl font-black text-emerald-700 italic tracking-tighter">0 LAK</p>
                    <span id="detailsStatus" class="px-4 py-2 rounded-full border-2 text-[9px] font-black">Status</span>
                </div>
                <p id="detailsDesc" class="text-gray-500 mb-10 text-sm leading-relaxed">Desc</p>
                <div class="mt-auto flex gap-4">
                    <button id="detailsAddBtn" class="flex-grow btn-adventure text-white py-5 rounded-[20px] font-black uppercase text-xs">Add to Bag</button>
                    <a id="detailsWaBtn" href="#" target="_blank" class="w-16 h-16 bg-[#25D366] text-white rounded-[20px] flex items-center justify-center text-2xl"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
    </div>

    <div id="placeModal" class="modal-overlay" onclick="if(event.target === this) window.closePlaceModal()">
        <div class="bg-white rounded-[40px] max-w-4xl w-full mx-4 overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
            <div class="md:w-1/2 h-80 md:h-auto overflow-hidden"><img id="placeDetailsImage" src="" class="w-full h-full object-cover"></div>
            <div class="md:w-1/2 p-10 overflow-y-auto text-emerald-950">
                <h2 id="placeDetailsTitle" class="text-3xl font-black mb-6 italic uppercase">Location</h2>
                <div class="flex flex-wrap gap-4 mb-8">
                    <span id="placeDetailsLoc" class="text-[10px] font-bold text-gray-400 uppercase"><i class="fa-solid fa-location-dot"></i> Location</span>
                    <span id="placeDetailsPrice" class="text-[10px] font-black text-emerald-800 bg-emerald-50 px-4 py-2 rounded-xl">Price</span>
                </div>
                <p id="placeDetailsDesc" class="text-gray-500 text-sm leading-relaxed mb-10">Desc</p>
                <a id="placeDetailsWaBtn" href="#" target="_blank" class="w-full block bg-[#25D366] text-white py-5 rounded-[20px] font-black uppercase text-center text-xs">Inquire WhatsApp</a>
            </div>
        </div>
    </div>

    <div id="blogModal" class="modal-overlay" onclick="if(event.target === this) window.closeBlogModal()">
        <div class="bg-white rounded-[40px] max-w-4xl w-full mx-4 overflow-hidden max-h-[92vh] flex flex-col">
            <div class="h-64 flex-shrink-0"><img id="blogDetailsImage" src="" class="w-full h-full object-cover"></div>
            <div class="p-10 overflow-y-auto">
                <span id="blogDetailsDate" class="text-amber-500 font-bold mb-3 block text-[10px]">Date</span>
                <h2 id="blogDetailsTitle" class="text-3xl font-black mb-8 text-emerald-950 italic uppercase">Title</h2>
                <p id="blogDetailsContent" class="text-gray-600 leading-relaxed whitespace-pre-line text-sm">Content</p>

    <div id="cartModal" class="modal-overlay" onclick="if(event.target === this) window.closeCart()">
        <div class="bg-white h-full max-w-md w-full ml-auto flex flex-col p-10">
            <div class="flex justify-between items-center mb-10">
                <h3 class="text-2xl font-black uppercase text-emerald-950">Your Bag</h3>
                <button onclick="window.closeCart()" class="text-emerald-950 text-3xl">&times;</button>
            </div>
            <div id="cartItems" class="flex-grow overflow-y-auto space-y-5"></div>
            <div class="pt-8 border-t mt-8">
                <div class="flex justify-between mb-8"><span class="font-bold text-gray-400">Total</span><span id="cartTotal" class="text-2xl font-black text-emerald-700">0 LAK</span></div>
                <button onclick="window.checkoutWhatsApp()" class="w-full bg-[#25D366] text-white py-5 rounded-[20px] font-black uppercase text-xs">Checkout WhatsApp</button>

    <footer class="bg-emerald-950 py-16 text-center border-t-8 border-amber-500">
        <h4 class="text-white font-black text-2xl italic">THESALE3</h4>
        <p class="text-[8px] text-emerald-900 mt-8 uppercase tracking-widest">© TheSale3 Business / Established for Adventure</p>
    </footer>

    <!-- Firebase & Data Loading Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Context Setup (Fail-safe)
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'thesale3-camping';

        // --- NEW GOOGLE SHEETS LINKS (Updated ID) ---
        const SHEET_ID = '1N09HDxPd3zEDqxHR-knpH2MP_fq_XkLJZJ4FdCAYEG0';
        const CSV_PRODUCTS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
        const CSV_PLACES = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=368688716`;
        const CSV_BLOGS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=187773397`;

        function parseCSV(text) {
            const rows = [];
            const lines = text.split(/\r?\n/);
            for (let line of lines) {
                if (!line.trim()) continue;
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else current += char;
                }
                result.push(current.trim());
                rows.push(result);
            }
            return rows;
        }

        const formatImgUrl = (url) => {
            if (!url) return '';
            if (url.startsWith('http')) return url;
            return 'assets/products/' + url;
        };

        // Fetch Functions
        window.loadProducts = async () => {
            try {
                const res = await fetch(CSV_PRODUCTS);
                if (!res.ok) throw new Error('HTTP error ' + res.status);
                const rows = parseCSV(await res.text()).slice(1);
                window.state.products = rows.map((cols, i) => ({
                    id: 'g-prod-' + i,
                    name: cols[1],
                    price: parseInt(cols[2]?.replace(/\D/g,'')) || 0,
                    category: cols[3],
                    img: formatImgUrl(cols[4]),
                    status: cols[5] || 'In Stock',
                    desc: cols[6] || 'Premium outdoor equipment.'
                })).filter(x => x.name);
                window.renderProducts(window.state.products);
                window.renderCategoryFilters();
            } catch (e) { console.error("CSV Load Fail (Products):", e); }
        };

        window.loadPlaces = async () => {
            try {
                const res = await fetch(CSV_PLACES);
                const rows = parseCSV(await res.text()).slice(1);
                window.state.places = rows.map(cols => ({
                    name: cols[0], loc: cols[1], price: cols[2], img: formatImgUrl(cols[3]), desc: cols[4] || ''
                })).filter(x => x.name);
                window.renderPlaces(window.state.places);
            } catch (e) { console.error("CSV Load Fail (Places):", e); }
        };

        window.loadBlogs = async () => {
            try {
                const res = await fetch(CSV_BLOGS);
                const rows = parseCSV(await res.text()).slice(1);
                window.state.blogs = rows.map(cols => ({
                    title: cols[0], date: cols[1], img: formatImgUrl(cols[2]), content: cols[3] || ''
                })).filter(x => x.title);
                window.renderBlogs(window.state.blogs);
            } catch (e) { console.error("CSV Load Fail (Blogs):", e); }
        };

        // Firebase Logic
        if (firebaseConfigStr) {
            try {
                const firebaseConfig = JSON.parse(firebaseConfigStr);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (s) => {
                            if (s.docs.length > 0) {
                                window.state.products = s.docs.map(d => ({ id: d.id, ...d.data() }));
                                window.renderProducts(window.state.products);
                            }
                        });
                    }
                });
                initAuth();
            } catch (e) { console.warn("Firebase Bypass:", e.message); }
        }

        // Always Trigger Google Sheets Load
        window.loadProducts();
        window.loadPlaces();
        window.loadBlogs();
    </script>
</body>
</html>
