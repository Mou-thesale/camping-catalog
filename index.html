<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheSale3 Camping Store | Premium Outdoor Gear Laos</title>
    
    <!-- Scripts & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #111827; scroll-behavior: smooth; }
        
        .nav-blur { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .hero-banner { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.4)), url('https://i.postimg.cc/FKL5Q4JW/489751506-1424454392283349-8154752889413656228-n.jpg'); background-size: cover; background-position: center; }
        
        .card-modern { background: #ffffff; border: 1px solid #f3f4f6; border-radius: 24px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; display: flex; flex-direction: column; cursor: pointer; }
        .card-modern:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-link { color: #059669; border-bottom: 2px solid #059669; }

        .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; }
        
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .cart-slide { animation: slideIn 0.3s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease forwards; }

        /* Status Colors */
        .status-in-stock { background: #dcfce7; color: #166534; }
        .status-pre-order { background: #fef3c7; color: #92400e; }

        .category-pill { transition: all 0.3s ease; white-space: nowrap; }
        .category-pill.active { background-color: #059669; color: white; border-color: #059669; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="nav-blur sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16 sm:h-20">
                <div class="flex flex-col cursor-pointer" onclick="switchPage('home')">
                    <span class="font-black text-xl leading-none tracking-tight text-black uppercase">THESALE3</span>
                    <span class="text-[9px] font-bold text-emerald-600 tracking-[0.2em] uppercase">Camping Store</span>
                </div>

                <div class="hidden md:flex items-center gap-8 font-bold text-[11px] uppercase tracking-widest">
                    <button onclick="switchPage('products')" class="nav-btn py-2 hover:text-emerald-600 transition" id="btn-products">Products</button>
                    <button onclick="switchPage('places')" class="nav-btn py-2 hover:text-emerald-600 transition" id="btn-places">Camping Places</button>
                    <button onclick="switchPage('blogs')" class="nav-btn py-2 hover:text-emerald-600 transition" id="btn-blogs">Blogs</button>
                </div>

                <div class="flex items-center gap-4 sm:gap-6">
                    <button onclick="openCart()" class="relative p-2">
                        <i class="fa-solid fa-cart-shopping text-xl text-gray-800"></i>
                        <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
                    </button>
                    <a href="https://wa.me/8562054849393" target="_blank" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest hidden sm:block">WhatsApp</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Content Container -->
    <div id="pages-container">

        <!-- Home Section -->
        <section id="page-home" class="page-section">
            <header class="hero-banner h-[500px] flex items-center justify-center text-center px-4">
                <div class="max-w-2xl fade-in">
                    <h1 class="text-5xl sm:text-7xl font-black text-white mb-6 tracking-tighter drop-shadow-2xl italic">Adventure Awaits</h1>
                    <p class="text-gray-100 text-xs sm:text-sm font-medium uppercase tracking-[0.4em] mb-10 drop-shadow-lg">Premium Outdoor Equipment & Adventure Guide Laos</p>
                    <div class="flex flex-wrap gap-4 justify-center">
                        <button onclick="switchPage('products')" class="bg-emerald-600 text-white px-10 py-4 rounded-full font-bold text-[11px] uppercase tracking-widest hover:bg-emerald-700 transition shadow-2xl">Shop Catalog</button>
                        <button onclick="switchPage('places')" class="bg-white/10 backdrop-blur-md border border-white/30 text-white px-10 py-4 rounded-full font-bold text-[11px] uppercase tracking-widest hover:bg-white hover:text-black transition">Explore Spots</button>
                    </div>
                </div>
            </header>
        </section>

        <!-- Products Section -->
        <section id="page-products" class="page-section hidden py-12 px-4 max-w-7xl mx-auto w-full">
            <div class="flex flex-col lg:flex-row justify-between items-center mb-10 gap-6">
                <div>
                    <h2 class="text-3xl font-black uppercase italic tracking-tight leading-none mb-1">Gear Catalog</h2>
                    <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Quality tested for Laos terrain</p>
                </div>
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="applyProductFilters()" placeholder="Search products / ຄົ້ນຫາ..." class="w-full pl-12 pr-4 py-3 rounded-2xl bg-white border border-gray-100 focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm transition">
                </div>
            </div>

            <!-- Categories Filter Bar -->
            <div id="categoryFilter" class="flex gap-2 overflow-x-auto no-scrollbar pb-6 mb-6">
                <!-- JavaScript will fill these -->
            </div>

            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Products load here -->
            </div>
        </section>

        <!-- Places Section -->
        <section id="page-places" class="page-section hidden py-12 px-4 max-w-7xl mx-auto w-full">
            <h2 class="text-3xl font-black uppercase italic tracking-tight mb-10">Best Camping Spots</h2>
            <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Places load here -->
            </div>
        </section>

        <!-- Blogs Section -->
        <section id="page-blogs" class="page-section hidden py-12 px-4 max-w-7xl mx-auto w-full">
            <h2 class="text-3xl font-black uppercase italic tracking-tight mb-10">Camping Blogs</h2>
            <div id="blogsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <!-- Blogs load here -->
            </div>
        </section>

    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-overlay" onclick="if(event.target === this) closeDetails()">
        <div class="bg-white rounded-[32px] max-w-4xl w-full mx-4 overflow-hidden shadow-2xl flex flex-col md:flex-row fade-in relative max-h-[90vh]">
            <button onclick="closeDetails()" class="absolute top-4 right-4 bg-white/80 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:text-black z-10 shadow-sm"><i class="fa-solid fa-xmark"></i></button>
            <div class="md:w-1/2 bg-gray-50 flex items-center justify-center p-8">
                <img id="detailsImage" src="" class="max-w-full max-h-[400px] object-contain drop-shadow-xl" onerror="this.src='https://placehold.co/600x600?text=Gear+Photo'">
            </div>
            <div class="md:w-1/2 p-8 md:p-12 flex flex-col overflow-y-auto">
                <span id="detailsCategory" class="text-[10px] font-black text-emerald-600 uppercase tracking-[0.3em] mb-4">Category</span>
                <h2 id="detailsTitle" class="text-3xl font-black text-gray-900 tracking-tighter mb-4 leading-none">Product Name</h2>
                <div class="flex items-center gap-4 mb-8">
                    <p id="detailsPrice" class="text-2xl font-black text-emerald-600 italic">0 LAK</p>
                    <span id="detailsStatus" class="text-[9px] font-black uppercase px-3 py-1.5 rounded-full shadow-sm">Status</span>
                </div>
                <div class="prose prose-sm text-gray-500 mb-10 leading-relaxed">
                    <p id="detailsDesc" class="whitespace-pre-line text-sm">No description available.</p>
                </div>
                <div class="mt-auto pt-6 border-t border-gray-100 flex gap-4">
                    <button id="detailsAddBtn" class="flex-grow bg-black text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-gray-800 transition shadow-lg">Add to Bag</button>
                    <a id="detailsWaBtn" href="#" target="_blank" class="w-14 h-14 bg-[#25D366] text-white rounded-2xl flex items-center justify-center text-2xl hover:brightness-105 transition shadow-lg"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay" onclick="if(event.target === this) closeCart()">
        <div class="bg-white h-full max-w-md w-full shadow-2xl ml-auto flex flex-col p-8 cart-slide">
            <div class="flex justify-between items-center mb-8 border-b pb-4">
                <div class="flex flex-col">
                    <h3 class="text-xl font-black uppercase tracking-tight text-emerald-800 leading-none">Your Bag</h3>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mt-1">Review your items</span>
                </div>
                <button onclick="closeCart()" class="text-gray-300 hover:text-black text-2xl transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItems" class="flex-grow overflow-y-auto space-y-4 pr-2 no-scrollbar"></div>
            <div class="border-t pt-6 mt-6 bg-gray-50 p-6 rounded-3xl">
                <div class="flex justify-between items-center mb-6 px-2">
                    <span class="font-bold text-gray-400 uppercase text-[10px] tracking-widest">Grand Total</span>
                    <span id="cartTotal" class="text-2xl font-black text-emerald-600 italic">0 LAK</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-[#25D366] text-white py-5 rounded-2xl font-black uppercase text-[11px] tracking-[0.2em] flex items-center justify-center gap-3 hover:brightness-105 transition shadow-lg">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t py-16 px-4 text-center mt-auto">
        <div class="flex justify-center gap-10 mb-10">
            <a href="https://www.facebook.com/Clicktobuy333333333" target="_blank" class="text-gray-300 hover:text-blue-600 transition transform hover:scale-110"><i class="fa-brands fa-facebook-f text-2xl"></i></a>
            <a href="https://www.tiktok.com/@thesale3camping" target="_blank" class="text-gray-300 hover:text-black transition transform hover:scale-110"><i class="fa-brands fa-tiktok text-2xl"></i></a>
        </div>
        <button onclick="adminLogin()" class="text-[9px] text-gray-200 uppercase tracking-widest hover:text-emerald-500 transition py-2 px-4 border border-gray-50 rounded-full">Management Access</button>
    </footer>

    <script>
        // --- 1. CONFIGURATION ---
        const CSV_PRODUCTS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOkTfIWeWI0KnhUyZZo1NeYP7B2AJVOXxFyl_g0NrmnWkastWzil9YCOKnTAdPBp8AHyP88LVI2lg6/pub?gid=0&single=true&output=csv';
        const CSV_PLACES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOkTfIWeWI0KnhUyZZo1NeYP7B2AJVOXxFyl_g0NrmnWkastWzil9YCOKnTAdPBp8AHyP88LVI2lg6/pub?gid=368688716&single=true&output=csv';
        const CSV_BLOGS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOkTfIWeWI0KnhUyZZo1NeYP7B2AJVOXxFyl_g0NrmnWkastWzil9YCOKnTAdPBp8AHyP88LVI2lg6/pub?gid=187773397&single=true&output=csv';
        
        const ADMIN_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1qdr-stVezfFRMqug8kuqM8rftflQcnxx/edit';
        const IMAGE_BASE_PATH = 'assets/products/';

        let state = {
            products: [],
            places: [],
            blogs: [],
            cart: JSON.parse(localStorage.getItem('thesale3_cart') || '[]'),
            currentCategory: 'All'
        };

        const categories = ["All", "Tents", "Cooking", "Coffee", "Lighting", "Sleeping", "Furniture", "Backpack", "Shoes", "Cloth", "Glasses", "Powerbank", "Survival"];

        // --- 2. NAVIGATION ---
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-link'));
            const target = document.getElementById('page-' + pageId);
            if(target) target.classList.remove('hidden');
            const btn = document.getElementById('btn-' + pageId);
            if(btn) btn.classList.add('active-link');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(pageId === 'products' && state.products.length === 0) loadProducts();
            if(pageId === 'places' && state.places.length === 0) loadPlaces();
            if(pageId === 'blogs' && state.blogs.length === 0) loadBlogs();
        }

        function parseCSV(text) {
            const rows = [];
            const lines = text.split(/\r?\n/);
            for (let line of lines) {
                if (!line.trim()) continue;
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else current += char;
                }
                result.push(current.trim());
                rows.push(result);
            }
            return rows;
        }

        // --- 3. DATA LOADERS ---
        async function loadProducts() {
            try {
                const res = await fetch(CSV_PRODUCTS);
                const text = await res.text();
                const rows = parseCSV(text).slice(1);
                state.products = rows.map((cols, i) => {
                    if(cols.length < 5) return null;
                    let imgSource = cols[4];
                    if (!imgSource.startsWith('http')) imgSource = IMAGE_BASE_PATH + imgSource;
                    return {
                        id: 'prod-' + i,
                        name: cols[1],
                        price: parseInt(cols[2].replace(/\D/g,'')) || 0,
                        category: cols[3],
                        img: imgSource,
                        status: cols[5] || 'In Stock',
                        desc: cols[6] || 'ພົບກັບອຸປະກອນແຄ້ມປິ້ງຄຸນນະພາບສູງຈາກ TheSale3.'
                    };
                }).filter(x => x);
                renderCategoryFilters();
                applyProductFilters();
            } catch (e) {
                document.getElementById('productGrid').innerHTML = "<div class='col-span-full py-20 text-center text-gray-400'>Error loading gear.</div>";
            }
        }

        // --- 4. CATEGORY LOGIC ---
        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilter');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="category-pill ${state.currentCategory === cat ? 'active' : ''} bg-white border border-gray-100 text-gray-400 px-6 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:border-emerald-600 transition">
                    ${cat}
                </button>
            `).join('');
        }

        window.setCategory = (cat) => {
            state.currentCategory = cat;
            renderCategoryFilters();
            applyProductFilters();
        };

        window.applyProductFilters = () => {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = state.products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(val);
                const matchesCategory = state.currentCategory === 'All' || p.category.toLowerCase() === state.currentCategory.toLowerCase();
                return matchesSearch && matchesCategory;
            });
            renderProducts(filtered);
        };

        // --- 5. RENDERING ---
        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            if (items.length === 0) {
                grid.innerHTML = "<div class='col-span-full py-20 text-center text-gray-400 uppercase text-[10px] font-bold tracking-widest'>No products found in this category</div>";
                return;
            }
            grid.innerHTML = items.map(p => {
                const isPre = p.status.toLowerCase().includes('pre');
                return `
                <div class="card-modern group p-6 flex flex-col fade-in" onclick="openDetails('${p.id}')">
                    <div class="h-52 rounded-[24px] bg-gray-50 overflow-hidden mb-6 relative">
                        <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" onerror="this.src='https://placehold.co/400x400?text=Gear+Photo'">
                        <span class="absolute top-3 right-3 text-[8px] font-black uppercase px-2.5 py-1 rounded-full shadow-sm ${isPre ? 'status-pre-order' : 'status-in-stock'}">${p.status}</span>
                    </div>
                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">${p.category}</span>
                    <h3 class="font-bold text-sm text-gray-900 mb-2 leading-tight flex-grow">${p.name}</h3>
                    <div class="mt-auto flex justify-between items-center pt-4 border-t border-gray-50">
                        <p class="font-black text-emerald-600 italic text-sm">${p.price.toLocaleString('en-US')} LAK</p>
                        <button onclick="event.stopPropagation(); addToCart('${p.id}')" class="w-10 h-10 rounded-2xl bg-gray-50 flex items-center justify-center hover:bg-emerald-600 hover:text-white transition shadow-sm"><i class="fa-solid fa-plus text-[10px]"></i></button>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadPlaces() {
            try {
                const res = await fetch(CSV_PLACES);
                const text = await res.text();
                const rows = parseCSV(text).slice(1);
                state.places = rows.map(cols => {
                    if(cols.length < 4) return null;
                    let imgSource = cols[3];
                    if (!imgSource.startsWith('http')) imgSource = IMAGE_BASE_PATH + imgSource;
                    return { name: cols[0], loc: cols[1], price: cols[2], img: imgSource, desc: cols[4] || '' };
                }).filter(x => x);
                const grid = document.getElementById('placesGrid');
                grid.innerHTML = state.places.map(place => `
                    <div class="card-modern overflow-hidden fade-in">
                        <div class="h-60 bg-gray-100 overflow-hidden"><img src="${place.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400?text=Camp+Spot'"></div>
                        <div class="p-8"><div class="flex justify-between items-start mb-3"><h3 class="font-black text-lg tracking-tight uppercase leading-none">${place.name}</h3><span class="text-[10px] font-black text-emerald-600 italic bg-emerald-50 px-2 py-1 rounded-lg">${place.price}</span></div><p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-4"><i class="fa-solid fa-location-dot mr-1"></i> ${place.loc}</p><p class="text-gray-500 text-xs leading-relaxed line-clamp-3">${place.desc}</p></div>
                    </div>`).join('');
            } catch (e) { document.getElementById('placesGrid').innerHTML = "<div class='col-span-full py-20 text-center text-gray-400'>Error loading places.</div>"; }
        }

        async function loadBlogs() {
            try {
                const res = await fetch(CSV_BLOGS);
                const text = await res.text();
                const rows = parseCSV(text).slice(1);
                state.blogs = rows.map(cols => {
                    if(cols.length < 3) return null;
                    let imgSource = cols[2];
                    if (!imgSource.startsWith('http')) imgSource = IMAGE_BASE_PATH + imgSource;
                    return { title: cols[0], date: cols[1], img: imgSource, content: cols[3] || '' };
                }).filter(x => x);
                const grid = document.getElementById('blogsGrid');
                grid.innerHTML = state.blogs.map(blog => `
                    <div class="flex flex-col md:flex-row gap-8 items-center fade-in bg-white p-6 rounded-[32px] border border-gray-50">
                        <div class="w-full md:w-2/5 h-52 rounded-[24px] overflow-hidden shadow-sm flex-shrink-0"><img src="${blog.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300?text=Blog+Image'"></div>
                        <div class="w-full md:w-3/5"><span class="text-[9px] font-bold text-emerald-600 uppercase tracking-[0.2em] mb-3 inline-block">${blog.date}</span><h3 class="text-xl font-black mb-4 tracking-tight leading-tight">${blog.title}</h3><p class="text-gray-500 text-xs leading-relaxed mb-6 line-clamp-3">${blog.content}</p><button class="text-[9px] font-bold uppercase tracking-widest text-emerald-700 flex items-center gap-2 group">Read More <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i></button></div>
                    </div>`).join('');
            } catch (e) { document.getElementById('blogsGrid').innerHTML = "<div class='col-span-full py-20 text-center text-gray-400'>Error loading blogs.</div>"; }
        }

        // --- 6. MODALS ---
        function openDetails(id) {
            const p = state.products.find(x => x.id === id);
            if(!p) return;
            document.getElementById('detailsImage').src = p.img;
            document.getElementById('detailsTitle').innerText = p.name;
            document.getElementById('detailsPrice').innerText = p.price.toLocaleString('en-US') + ' LAK';
            document.getElementById('detailsCategory').innerText = p.category;
            document.getElementById('detailsDesc').innerText = p.desc;
            const statusBadge = document.getElementById('detailsStatus');
            statusBadge.innerText = p.status;
            statusBadge.className = `text-[9px] font-black uppercase px-3 py-1.5 rounded-full shadow-sm ${p.status.toLowerCase().includes('pre') ? 'status-pre-order' : 'status-in-stock'}`;
            document.getElementById('detailsAddBtn').onclick = () => { addToCart(p.id); closeDetails(); };
            document.getElementById('detailsWaBtn').href = `https://wa.me/8562054849393?text=${encodeURIComponent("Sabaidee! I am interested in: " + p.name)}`;
            document.getElementById('detailsModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeDetails() { document.getElementById('detailsModal').style.display = 'none'; document.body.style.overflow = 'auto'; }

        // --- 7. CART SYSTEM ---
        function addToCart(id) {
            const p = state.products.find(x => x.id === id);
            if(!p) return;
            const exists = state.cart.find(i => i.id === id);
            if(exists) exists.qty++; else state.cart.push({ ...p, qty: 1 });
            updateCartCount();
        }

        function updateCartCount() {
            const count = state.cart.reduce((s, i) => s + i.qty, 0);
            const badge = document.getElementById('cartCount');
            badge.innerText = count;
            count > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');
            localStorage.setItem('thesale3_cart', JSON.stringify(state.cart));
        }

        function openCart() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            if(state.cart.length === 0) {
                container.innerHTML = '<div class="text-center py-24 text-gray-300 text-[10px] uppercase font-bold tracking-[0.3em]">No adventure gear here yet</div>';
                totalEl.innerText = '0 LAK';
            } else {
                let total = 0;
                container.innerHTML = state.cart.map(item => {
                    total += item.price * item.qty;
                    return `<div class="flex gap-5 items-center bg-gray-50/50 p-5 rounded-[24px] border border-gray-100/50"><img src="${item.img}" class="w-14 h-14 object-cover rounded-2xl shadow-sm" onerror="this.src='https://placehold.co/100x100?text=X'"><div class="flex-grow"><h4 class="font-bold text-[10px] uppercase leading-tight text-gray-900 mb-1">${item.name}</h4><p class="text-emerald-600 font-bold text-[10px] italic">${item.price.toLocaleString('en-US')} LAK</p></div><div class="flex items-center gap-3 bg-white p-1 rounded-xl shadow-sm"><button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center text-[10px] text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-minus"></i></button><span class="text-[11px] font-black w-4 text-center">${item.qty}</span><button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center text-[10px] text-gray-400 hover:text-emerald-500 transition"><i class="fa-solid fa-plus"></i></button></div></div>`;
                }).join('');
                totalEl.innerText = total.toLocaleString('en-US') + ' LAK';
            }
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCart() { document.getElementById('cartModal').style.display = 'none'; }

        function changeQty(id, delta) {
            const item = state.cart.find(i => i.id === id);
            if(!item) return;
            item.qty += delta;
            if(item.qty <= 0) state.cart = state.cart.filter(i => i.id !== id);
            updateCartCount(); openCart();
        }

        function checkoutWhatsApp() {
            if(state.cart.length === 0) return;
            let msg = "Sabaidee TheSale3! I am interested in these items:\n\n";
            state.cart.forEach((i, idx) => msg += `${idx+1}. ${i.name} [x${i.qty}]\n`);
            const total = state.cart.reduce((s, i) => s + (i.price * i.qty), 0);
            msg += `\nTotal: ${total.toLocaleString('en-US')} LAK\n\nPlease let me know if these are ready for pickup or delivery.`;
            window.open(`https://wa.me/8562054849393?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function adminLogin() {
            const pass = prompt("Enter Portal Password:");
            if(pass === "Mou54849393") window.open(ADMIN_SHEET_URL, '_blank');
            else if(pass !== null) alert("Authentication Failed.");
        }

        window.onload = () => { updateCartCount(); switchPage('home'); };
    </script>
</body>
</html>
